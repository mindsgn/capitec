name: Nightly browsers

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-browsers
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright
        run: yarn e2e --project=firefox --project='webkit (Safari)' --project='android (Pixel 7)' --project='ios (iPhone 14)'
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-nightly
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

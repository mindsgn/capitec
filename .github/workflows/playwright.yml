name: CI

# Branch pushes and pull requests both run these jobs. Require "unit" and "e2e"
# in a main-branch ruleset so GitHub rejects the merge until they pass.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Git SHA to deploy. Set this to roll back; leave it empty to run checks only.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: yarn e2e --project=chromium
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loan-simulator:ci .

      - name: Serve the UI and the loan API
        run: |
          set -euo pipefail
          docker rm -f loan-simulator-ci >/dev/null 2>&1 || true
          docker run -d --name loan-simulator-ci -p 3000:3000 loan-simulator:ci
          cleanup() {
            docker logs loan-simulator-ci || true
            docker rm -f loan-simulator-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/loans/products >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/loans/products)" = 200

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.sha != '')
    needs: [unit, e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/loan-simulator" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.ref }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.ref }}:latest
          build-args: |
            VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'http://localhost:3000' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}

      - name: Deploy digest
        env:
          TAG: ${{ steps.image.outputs.ref }}:${{ steps.image.outputs.sha }}
          LATEST: ${{ steps.image.outputs.ref }}:latest
          DIGEST: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Deploying ${DIGEST}"
          echo "Tag ${TAG}"
          echo "Latest ${LATEST}"
          echo "Publish port 3000. Health check: GET /api/loans/products."
          {
            echo "### Production"
            echo ""
            echo "Deploy \`${DIGEST}\`."
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Latest: \`${LATEST}\`"
            echo "- Port: 3000"
            echo "- Health check: \`GET /api/loans/products\`"
            echo "- Site URL was inlined at build time from \`VITE_SITE_URL\`."
            echo "- Roll back by running this workflow with the previous SHA."
          } >> "$GITHUB_STEP_SUMMARY"
